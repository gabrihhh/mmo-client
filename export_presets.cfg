; Presets de exportação. Ver mmo-docs [INFRA-08].
; - "launcher-desktop": simula o APK no PC (só a tela do atualizador). Rodar: godot --main-pack build/launcher.pck
; - "game-desktop": o pacote do jogo (.pck) para desktop. Publicar: tools/publish_update.sh
; Android (APK + pacote com texturas ETC2/ASTC) entra quando a exportação Android for configurada ([ROAD-02] item 5).

[preset.0]

name="launcher-desktop"
platform="Linux"
runnable=false
export_filter="resources"
export_files=PackedStringArray("res://scenes/boot/updater.tscn", "res://scripts/boot/updater.gd")
include_filter=""
exclude_filter=""
export_path="build/launcher.pck"

[preset.0.options]

binary_format/embed_pck=false

[preset.1]

name="game-desktop"
platform="Linux"
runnable=false
export_filter="all_resources"
include_filter=""
exclude_filter="scenes/boot/updater.tscn, scripts/boot/updater.gd"
export_path="build/game.pck"

[preset.1.options]

binary_format/embed_pck=false
