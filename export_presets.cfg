; Presets de exportação. Ver mmo-docs [INFRA-08] e [CLI-06].
; - android-launcher: o APK (só a tela do atualizador). Gerar: tools/build_apk.sh
; - game-android:     o pacote do jogo para celular (texturas ETC2/ASTC). Publicar: tools/publish_update.sh android
; - launcher-desktop: simula o APK no PC. Rodar: cd build && godot --main-pack launcher.pck
; - game-desktop:     o pacote do jogo para PC. Publicar: tools/publish_update.sh desktop
; Os launchers só levam o atualizador; os pacotes levam todo o resto (menos o atualizador).

[preset.0]

name="launcher-desktop"
platform="Linux"
runnable=false
export_filter="resources"
export_files=PackedStringArray("res://scenes/boot/updater.tscn", "res://scripts/boot/updater.gd")
include_filter=""
exclude_filter=""
export_path="build/launcher.pck"

[preset.0.options]

binary_format/embed_pck=false

[preset.1]

name="game-desktop"
platform="Linux"
runnable=false
export_filter="all_resources"
include_filter=""
exclude_filter="scenes/boot/updater.tscn, scripts/boot/updater.gd, build/*"
export_path="build/game-desktop.pck"

[preset.1.options]

binary_format/embed_pck=false

[preset.2]

name="android-launcher"
platform="Android"
runnable=true
export_filter="resources"
export_files=PackedStringArray("res://scenes/boot/updater.tscn", "res://scripts/boot/updater.gd")
include_filter=""
exclude_filter=""
export_path="build/mmo.apk"

[preset.2.options]

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.mmo.game"
package/name="MMO"
package/signed=true
version/code=1
version/name="1"
permissions/internet=true
screen/immersive_mode=true

[preset.3]

name="game-android"
platform="Android"
runnable=false
export_filter="all_resources"
include_filter=""
exclude_filter="scenes/boot/updater.tscn, scripts/boot/updater.gd, build/*"
export_path="build/game-android.pck"

[preset.3.options]

gradle_build/use_gradle_build=false
architectures/arm64-v8a=true
package/unique_name="com.mmo.game"
